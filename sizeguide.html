<style>
  :root {
    --cream: #FAF8F4; --dark: #1A1714; --accent: #8B6F4E; --border: #E8E2D9;
  }
  body { background: var(--cream); padding: 20px; font-family: 'DM Sans', sans-serif; }
  
  /* button styling */
  .back-btn {
    display: inline-block;
    padding: 12px 24px;
    background: var(--dark);
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.9rem;
    letter-spacing: 1px;
    margin-bottom: 30px;
    transition: 0.3s;
    border: none;
  }
  .back-btn:hover { background: var(--accent); }

  /* table styling */
  .table-container {
    overflow-x: auto;
    width: 100%;
    background: white;
    border: 1px solid var(--border);
  }
  .size-guide-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    min-width: 500px; /* ensures it scrolls on small screens */
  }
  .size-guide-table th {
    background-color: var(--dark);
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 15px;
    text-align: center;
  }
  .size-guide-table td {
    padding: 15px;
    border: 1px solid var(--border);
    text-align: center;
    color: #444;
  }
  .size-guide-table tr:nth-child(even) { background-color: #f9f9f9; }

  @media (max-width: 600px) {
    .back-btn { width: 100%; text-align: center; }
  }
</style>

<a href="./index.html" class="back-btn">← GO BACK TO SHOP</a>

<div class="table-container">
  <table class="size-guide-table">
    <thead>
      <tr>
        <th>Size</th>
        <th>Chest</th>
        <th>Length</th>
        <th>Shoulder</th>
        <th>Sleeve</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>S</td><td>19</td><td>28</td><td>16</td><td>9</td></tr>
      <tr><td>M</td><td>21</td><td>29</td><td>16</td><td>9</td></tr>
      <tr><td>L</td><td>22</td><td>30</td><td>17</td><td>9.5</td></tr>
      <tr><td>XL</td><td>23</td><td>30</td><td>20</td><td>9.5</td></tr>
      <tr><td>XXL</td><td>25</td><td>31</td><td>20</td><td>11</td></tr>
    </tbody>
  </table>
</div>
<p style="font-size: 0.8rem; color: #777; text-align: center; margin-top: 15px;">* All measurements are in inches.</p>
