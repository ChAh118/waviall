<!DOCTYPE html>
<html>
<head>
    <title>waviall - admin</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #faf8f4; color: #1a1714; }
        .card { background: white; padding: 20px; border: 1px solid #e8e2d9; max-width: 450px; margin: auto; }
        input, textarea, select { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; background: #1a1714; color: white; border: none; cursor: pointer; font-weight: bold; }
        #output { margin-top: 20px; background: #333; color: #fff; padding: 15px; font-family: monospace; font-size: 11px; white-space: pre-wrap; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>waviall product generator</h2>
        <p style="font-size: 0.8rem; color: #666;">fill details -> copy code -> paste in index.html</p>
        <input type="text" id="n" placeholder="product name">
        <input type="text" id="c" placeholder="category">
        <input type="text" id="e" placeholder="emoji (e.g. 👕)">
        <input type="number" id="p" placeholder="price (rs.)">
        <input type="text" id="s" placeholder="sizes (S,M,L)">
        <textarea id="d" placeholder="description"></textarea>
        <button onclick="gen()">generate product code</button>
        <div id="output">code will appear here...</div>
    </div>

    <script>
        function gen() {
            const item = {
                id: Date.now(),
                name: document.getElementById('n').value,
                category: document.getElementById('c').value,
                emoji: document.getElementById('e').value,
                price: parseInt(document.getElementById('p').value),
                originalPrice: null,
                badge: 'New',
                desc: document.getElementById('d').value,
                sizes: document.getElementById('s').value.split(','),
                outOfStock: []
            };
            document.getElementById('output').textContent = JSON.stringify(item, null, 2) + ",";
        }
    </script>
</body>
</html>
