<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WAVIALL — Premium Clothing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👔</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
  /* --- WAVIAL STYLING --- */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FAF8F4;--dark:#1A1714;--accent:#8B6F4E;--accent-light:#C4A882;
    --border:#E8E2D9;--text-muted:#7A7470;--white:#FFFFFF;
    --success:#2D6A4F;--danger:#C0392B;
  }
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);overflow-x:hidden}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,248,244,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase}
  .logo span{color:var(--accent)}

  .hero{padding:120px 2rem 60px;text-align:center;background:white;margin-bottom:2rem}
  .hero-title{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:400;line-height:1;margin:1rem 0}
  
  .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem;padding:2rem}
  .product-card{background:white;border:1px solid var(--border);cursor:pointer;transition:0.3s}
  .product-card:hover{border-color:var(--accent)}
  .product-img{height:350px;display:flex;align-items:center;justify-content:center;font-size:5rem;background:#fcfcfc}
  .product-info{padding:1.5rem;text-align:center}

  /* Modal Styling */
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000}
  .modal.active{display:flex}
  .modal-content{background:white;width:90%;max-width:500px;padding:2rem;position:relative}
  .close-btn{position:absolute;top:1rem;right:1rem;cursor:pointer;font-size:1.5rem}

  .cart-btn{background:var(--dark);color:white;padding:0.6rem 1.2rem;border:none;cursor:pointer}
  .checkout-form input, .checkout-form select{width:100%;padding:0.8rem;margin-bottom:1rem;border:1px solid var(--border)}
  .place-order-btn{background:var(--success);color:white;width:100%;padding:1rem;border:none;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<nav>
  <div class="logo">WAVI<span>A</span>LL</div>
  <button class="cart-btn" onclick="openCart()">🛍 Cart <span id="cartCount">0</span></button>
</nav>

<section class="hero">
  <h1 class="hero-title">Waviall Signature<br><em>Collection.</em></h1>
  <p>Premium fabric. Perfect fit.</p>
</section>

<div class="products-grid" id="productsGrid"></div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modalDetails"></div>
    <select id="sizeSelect" style="width:100%; padding:10px; margin:10px 0;"></select>
    <button class="place-order-btn" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<div id="checkoutModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="document.getElementById('checkoutModal').classList.remove('active')">&times;</span>
    <h3>Checkout</h3>
    <div id="cartItemsList" style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
    <div class="checkout-form">
      <input type="text" id="firstName" placeholder="First Name" required>
      <input type="text" id="phone" placeholder="WhatsApp Number (e.g. 03001234567)" required>
      <input type="text" id="address" placeholder="Full Delivery Address" required>
      <p style="color:var(--danger); font-size:12px; margin-bottom:10px;">
        * Note: Online Payment only. Cash on Delivery is unavailable due to customization costs.
      </p>
      <button class="place-order-btn" onclick="sendWhatsAppOrder()">Send Order via WhatsApp →</button>
    </div>
  </div>
</div>

<script>
// --- 1. SET YOUR WHATSAPP NUMBER HERE ---
const MY_PHONE_NUMBER = "923001234567"; // Use international format without +

// --- 2. MANAGE PRODUCTS HERE ---
const PRODUCTS = [
  {
    id: 1,
    name: "Linen Overshirt",
    price: 3200,
    emoji: "👔",
    sizes: ["S", "M", "L", "XL"],
    desc: "Premium 100% linen. Breathable and stylish."
  },
  {
    id: 2,
    name: "Premium Kurta",
    price: 3800,
    emoji: "🧥",
    sizes: ["M", "L", "XL"],
    desc: "Luxury cotton lawn with hand-finished details."
  },
  // To add more, just copy the block above and change the ID
];

let cart = [];
let currentPid = null;

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="product-img">${p.emoji}</div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <p>Rs. ${p.price}</p>
      </div>
    </div>
  `).join('');
}

function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  currentPid = id;
  document.getElementById('modalDetails').innerHTML = `<h2>${p.name}</h2><p>${p.desc}</p><h3>Rs. ${p.price}</h3>`;
  document.getElementById('sizeSelect').innerHTML = p.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('productModal').classList.add('active');
}

function closeModal() {
  document.getElementById('productModal').classList.remove('active');
}

function addToCart() {
  const p = PRODUCTS.find(x => x.id === currentPid);
  const size = document.getElementById('sizeSelect').value;
  cart.push({ ...p, selectedSize: size });
  updateCartCount();
  closeModal();
  alert(`${p.name} added to cart!`);
}

function updateCartCount() {
  document.getElementById('cartCount').innerText = cart.length;
}

function openCart() {
  if(cart.length === 0) return alert("Cart is empty!");
  const list = document.getElementById('cartItemsList');
  list.innerHTML = cart.map((item, idx) => `
    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
      <span>${item.name} (${item.selectedSize})</span>
      <span>Rs. ${item.price} <button onclick="removeFromCart(${idx})" style="color:red; background:none; border:none; cursor:pointer;">x</button></span>
    </div>
  `).join('');
  document.getElementById('checkoutModal').classList.add('active');
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCartCount();
  if(cart.length === 0) document.getElementById('checkoutModal').classList.remove('active');
  else openCart();
}

// --- WHATSAPP ORDER LOGIC ---
function sendWhatsAppOrder() {
  const name = document.getElementById('firstName').value;
  const phone = document.getElementById('phone').value;
  const addr = document.getElementById('address').value;

  if(!name || !phone || !addr) return alert("Please fill all details");

  let itemsText = cart.map(item => `- ${item.name} (${item.selectedSize}): Rs.${item.price}`).join('%0A');
  let total = cart.reduce((sum, item) => sum + item.price, 0);

  // Structured message for WhatsApp
  let message = `*NEW ORDER - WAVIALL*%0A%0A` +
                `*Customer:* ${name}%0A` +
                `*Phone:* ${phone}%0A` +
                `*Address:* ${addr}%0A%0A` +
                `*Items:*%0A${itemsText}%0A%0A` +
                `*Total:* Rs. ${total}%0A%0A` +
                `_Please send payment details for Online Transfer._`;

  window.open(`https://wa.me/${MY_PHONE_NUMBER}?text=${message}`, '_blank');
  
  // Clear cart after redirect
  cart = [];
  updateCartCount();
  document.getElementById('checkoutModal').classList.remove('active');
}

window.onload = renderProducts;
</script>

</body>
</html>
