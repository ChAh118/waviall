<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WAVIALL — Premium Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --cream:#FAF8F4;--dark:#1A1714;--accent:#8B6F4E;--border:#E8E2D9;--white:#FFFFFF;--danger:#C0392B;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);margin:0;}
  nav{position:fixed;top:0;width:100%;background:white;border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;justify-content:space-between;z-index:100;box-sizing:border-box;}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:bold;letter-spacing:2px;}
  
  .container{max-width:1200px;margin:100px auto;padding:0 20px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2rem;}
  .card{background:white;border:1px solid var(--border);cursor:pointer;transition:0.3s;}
  .card img{width:100%;height:300px;object-fit:cover;}
  .card-body{padding:1rem;text-align:center;}

  /* Modal */
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;z-index:1000;overflow-y:auto;}
  .modal-content{background:white;max-width:600px;margin:50px auto;padding:2rem;position:relative;}
  .close{position:absolute;top:10px;right:20px;font-size:2rem;cursor:pointer;}
  
  .product-detail-flex{display:flex;gap:20px;flex-wrap:wrap;}
  .product-detail-flex img{width:200px;height:250px;object-fit:cover;}
  
  .cart-item{display:flex;gap:15px;align-items:center;border-bottom:1px solid #eee;padding:10px 0;}
  .cart-item img{width:60px;height:60px;object-fit:cover;}

  input, select, textarea {width:100%;padding:10px;margin:5px 0 15px;border:1px solid var(--border);}
  .btn{background:var(--dark);color:white;border:none;padding:12px 20px;width:100%;cursor:pointer;font-weight:bold;}
  .payment-box{background:#f9f9f9;padding:10px;border-left:4px solid var(--accent);margin:10px 0;display:none;}
</style>
</head>
<body>

<nav>
  <div class="logo">WAVIALL</div>
  <button onclick="openCart()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">🛒 <span id="cartCount">0</span></button>
</nav>

<div class="container">
  <div class="grid" id="productsGrid"></div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModals()">&times;</span>
    <div class="product-detail-flex">
      <img id="mImg" src="" alt="">
      <div style="flex:1; min-width:250px;">
        <h2 id="mName"></h2>
        <p id="mDesc"></p>
        <p><strong>Stock Left:</strong> <span id="mStock"></span></p>
        <p><strong id="mPrice"></strong></p>
        <label>Select Size:</label>
        <select id="mSize"></select>
        <button class="btn" onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>
</div>

<div id="cartModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModals()">&times;</span>
    <h3>Your Cart</h3>
    <div id="cartList"></div>
    <hr>
    <h4>Shipping Details</h4>
    <form id="orderForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="text" name="phone" placeholder="Phone Number" required>
      <input type="text" name="street" placeholder="Street Address / House #" required>
      <input type="text" name="city" placeholder="City" required>
      <input type="text" name="province" placeholder="Province / State" required>
      <input type="text" name="postal" placeholder="Postal Code" required>
      
      <label>Payment Method:</label>
      <select name="payment" id="payMethod" onchange="togglePaymentInfo()" required>
        <option value="">Choose Method...</option>
        <option value="EasyPaisa">EasyPaisa</option>
        <option value="JazzCash">JazzCash</option>
        <option value="Bank Transfer">Bank Transfer</option>
      </select>

      <div id="paymentInfo" class="payment-box">
        <p id="payDetails"></p>
        <p style="font-size:0.8rem; color:var(--danger);">* Due to printing costs, COD is not available. Please send the transaction proof to: <strong>waviall@gmail.com</strong></p>
      </div>

      <button type="submit" class="btn" id="submitBtn">Complete Order</button>
    </form>
  </div>
</div>

<script>
// --- CONFIG ---
const FORMSPREE_ID = "YOUR_ID_HERE"; // Get this from formspree.io
const ACCOUNT_DETAILS = {
  "EasyPaisa": "03xx-xxxxxxx (Name: Waviall)",
  "JazzCash": "03xx-xxxxxxx (Name: Waviall)",
  "Bank Transfer": "HBL 1234-5678-9012 (Name: Waviall)"
};

const PRODUCTS = [
  {
    id: 1,
    name: "Signature Tee",
    price: 2500,
    img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500", // replace with your image link
    sizes: ["S", "M", "L"],
    stock: 12,
    desc: "100% premium cotton with waviall minimalist branding."
  },
  {
    id: 2,
    name: "Classic Hoodie",
    price: 4500,
    img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500",
    sizes: ["M", "L", "XL"],
    stock: 5,
    desc: "Heavyweight fleece for maximum comfort."
  }
];

let cart = [];

function render() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="card" onclick="openProduct(${p.id})">
      <img src="${p.img}">
      <div class="card-body">
        <strong>${p.name}</strong><br>Rs. ${p.price}
      </div>
    </div>
  `).join('');
}

let activeP = null;
function openProduct(id) {
  activeP = PRODUCTS.find(p => p.id === id);
  document.getElementById('mImg').src = activeP.img;
  document.getElementById('mName').innerText = activeP.name;
  document.getElementById('mDesc').innerText = activeP.desc;
  document.getElementById('mStock').innerText = activeP.stock;
  document.getElementById('mPrice').innerText = "Rs. " + activeP.price;
  document.getElementById('mSize').innerHTML = activeP.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('productModal').style.display = 'block';
}

function addToCart() {
  const size = document.getElementById('mSize').value;
  cart.push({...activeP, selectedSize: size});
  updateCart();
  closeModals();
}

function updateCart() {
  document.getElementById('cartCount').innerText = cart.length;
}

function openCart() {
  if(cart.length === 0) return alert("Cart is empty");
  const list = document.getElementById('cartList');
  list.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${item.img}">
      <div>
        <strong>${item.name}</strong><br>
        Size: ${item.selectedSize} - Rs. ${item.price}
      </div>
    </div>
  `).join('');
  document.getElementById('cartModal').style.display = 'block';
}

function togglePaymentInfo() {
  const method = document.getElementById('payMethod').value;
  const box = document.getElementById('paymentInfo');
  if(method) {
    box.style.display = 'block';
    document.getElementById('payDetails').innerText = "Transfer to: " + ACCOUNT_DETAILS[method];
  } else {
    box.style.display = 'none';
  }
}

function closeModals() {
  document.getElementById('productModal').style.display = 'none';
  document.getElementById('cartModal').style.display = 'none';
}

// --- FORMSPREE SUBMISSION ---
document.getElementById('orderForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.innerText = "Processing...";
  btn.disabled = true;

  const formData = new FormData(e.target);
  formData.append("Order_Details", cart.map(i => `${i.name} (${i.selectedSize})`).join(", "));
  formData.append("Total_Bill", cart.reduce((sum, i) => sum + i.price, 0));

  try {
    const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });
    if (response.ok) {
      alert("Order Received! Send your screenshot to waviall@gmail.com to confirm.");
      cart = [];
      updateCart();
      closeModals();
      e.target.reset();
    }
  } catch (err) {
    alert("Error sending order. Try again.");
  }
  btn.innerText = "Complete Order";
  btn.disabled = false;
};

render();
</script>
</body>
</html>
